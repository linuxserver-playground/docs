# Pull request check: fetch the image pages from the hub and build with --strict, so a broken link, a missing
# nav entry or a page the hub stopped producing fails the PR instead of the deploy.
name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Fetch the image pages from the hub
        run: python scripts/fetch-image-pages.py

      - name: Build
        env:
          CI: 'true'
        run: mkdocs build --strict

      - name: Report
        run: |
          echo "## Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- image pages: $(ls docs/images/*.md | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- deprecated: $(ls docs/deprecated_images/docker-*.md 2>/dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- html files: $(find site -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
