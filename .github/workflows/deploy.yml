# Builds the documentation and deploys it to GitHub Pages at https://linuxserver-playground.github.io/docs/.
#
# The image pages are not in this repository: scripts/fetch-image-pages.py downloads them from the hub at build
# time. The site is therefore rebuilt on every push to main, once a day, when the hub sends a
# repository_dispatch of type `hub-updated`, and on demand.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  repository_dispatch:
    types: [hub-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date-localized reads the history of every page

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      - name: Fetch the image pages from the hub
        run: python scripts/fetch-image-pages.py

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          CI: 'true' # enables the git-revision-date and minify plugins (mkdocs.yml, plugins.group)
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
